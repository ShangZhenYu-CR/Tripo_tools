<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tripo Multiview Paste</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="title">Tripo Multiview Paste</div>
        <div class="subtitle">3 or 4 images · FRONT / LEFT / RIGHT / BACK</div>
      </div>
      <div class="topbar-actions">
        <span id="tripo-status" class="chip chip-warning">TRIPO ?</span>
        <button id="close-panel" class="close-panel-btn" title="关闭浮窗" aria-label="关闭浮窗">×</button>
      </div>
    </header>

    <section class="controls">
      <div id="set-tabs" class="set-tabs"></div>
      <div class="control-actions">
        <button id="delete-current" class="utility-btn" title="删除当前组">删除当前</button>
        <button id="clear-all" class="utility-btn danger" title="删除全部组和图片">全部删除</button>
      </div>
    </section>

    <section id="single-set-view" class="single-set-view">
      <div id="view-grid" class="view-grid"></div>
    </section>

    <section id="all-sets-view" class="all-sets-view" hidden>
      <div id="all-sets-list" class="all-sets-list"></div>
    </section>

    <footer class="footerbar">
      <div class="footer-left">
        <span id="set-status" class="chip chip-warning">0 / 4 COLLECTING</span>
        <label class="auto-clear-toggle" title="Fill Tripo 前先清空 Tripo 当前多视图图片">
          <input id="auto-clear-tripo" type="checkbox" checked />
          <span>Fill 前清空</span>
        </label>
      </div>
      <div class="footer-actions">
        <button id="clear-tripo" class="secondary-btn" title="只清空 Tripo 当前多视图，不删除扩展里的图片">清空 Tripo</button>
        <button id="fill-tripo" class="primary-btn" disabled>Fill Tripo</button>
      </div>
    </footer>

    <div id="toast" class="toast" hidden></div>
  </main>

  <script src="popup.js"></script>
  <script src="panel-close.js"></script>
</body>
</html>
